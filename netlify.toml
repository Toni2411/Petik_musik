# Petik is a static site: no build step, publish the folder as is.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # The page needs the camera and microphone; nothing else may use them.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Large files that rarely change: cache them in the browser for a week.
[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
